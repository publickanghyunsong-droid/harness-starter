# harness.toml — 이 프로젝트의 하네스 설정 (**여기 말고 어디에도 경로를 박지 않는다**)
#
# 읽는 도구: harness/audit.py · harness/score_canaries.py · preflight/*.sh (셸 브리지 경유)
# 규칙
#   · 상대경로는 전부 **프로젝트 루트** 기준. 루트 = 이 파일이 있는 디렉터리(기본).
#   · `{root}` `{config_dir}` `{home}` 치환 가능.
#   · ★**섹션을 지우면 그 점검은 "해당 없음(SKIP)"이 된다.** 에러가 아니다.
#     노트/위키가 없는 프로젝트, 예약 루틴이 없는 프로젝트도 그대로 돈다.
#
# 이 파일이 배포 기본값이다. 새 프로젝트는 여기서 필요한 섹션만 켜라.

[project]
name = "my-research-project"
# root = "."          # 이 파일 기준 상대. 보통 생략한다.

# ─────────────────────────────────────────────────────────────
# [routine] 점검 루틴 자신의 생존 확인
#   ★타이머이자 생존 증거를 **모두가 읽는 타임라인**(작업 로그)에 둔다.
#     전용 상태 파일은 아무도 안 열어서, 안 돈 루틴이 조용히 숨는다.
#     루틴은 매 회차 로그에 `## [YYYY-MM-DD] check | …` 한 줄을 남기고,
#     기계 점검이 그 줄을 읽어 오래됐으면 WARN을 띄운다 → 루틴이 죽으면 다음 세션이 안다.
# ─────────────────────────────────────────────────────────────
[routine]
name = "harness-check"
max_age_days = 10
# log_file = "docs/log.md"                    # ← 작업 로그가 있으면 켜라(없으면 SKIP)
# marker = '^##\s*\[(\d{4}-\d{2}-\d{2})\]\s*check\b'
# registered_path = "{home}/.config/my-scheduler/harness-check"   # 실행체 등록 여부 확인용

# ─────────────────────────────────────────────────────────────
# [scheduled] 배경에서 도는 예약 작업 관측
#   ⚠️운영체제 의존이라 **기본은 꺼져 있다.** 쓰려면 자기 OS 명령으로 켠다.
#     macOS : list_cmd = "launchctl list"                · residue_dir = "{home}/Library/LaunchAgents"
#     Linux : list_cmd = "systemctl --user list-timers --no-pager"  또는 "crontab -l"
#   왜 보나: 잊힌 예약이 배경에서 무거운 작업을 재개하던 중 새 작업을 얹어
#            세 프로세스 동시 사망·5시간 유실한 실측 사고가 있었다. 유령 예약은 사고 원인이다.
# ─────────────────────────────────────────────────────────────
# [scheduled]
# list_cmd = "launchctl list"
# match = "my-research"          # 이 정규식에 걸리는 줄만 본다(전부 보면 노이즈)
# residue_dir = "{home}/Library/LaunchAgents"
# residue_glob = "*my-research*.plist"   # 해제만 하고 정의가 남으면 재부팅 때 부활한다

# ─────────────────────────────────────────────────────────────
# [gate_debt] "명세만 있고 검사기가 없는 게이트"를 세는 부채 카운터
#   규약 문서에 아래 문자열을 표식으로 남겨두고, 그 개수를 추세로 본다.
# ─────────────────────────────────────────────────────────────
[gate_debt]
dirs = ["docs"]
pattern = "checker 없음"

# ─────────────────────────────────────────────────────────────
# [[smoke]] 도구 스모크런 — 규약이 전제하는 스크립트가 *지금도* 도는가
#   ★게이트는 만든 날에만 도는 게 아니라 계속 돌아야 한다. 조용히 깨진 검사기가
#     가장 위험하다(있다고 믿는데 없다).
#   ok = 정상으로 볼 종료코드 목록.
# ─────────────────────────────────────────────────────────────
[[smoke]]
name = "preflight"
# preflight는 "지금 착수해도 되나"를 답하는 도구라 1(NO-GO)·2(측정불가)도 정상 동작이다.
# 여기서 재는 것은 머신이 한가한가가 아니라 **스크립트가 살아 있는가**다.
cmd = "bash {root}/preflight/preflight_load_check.sh >/dev/null 2>&1"
ok = [0, 1, 2]

[[smoke]]
name = "bootstrap-docs"
# 도구마다 읽는 지시 파일 이름이 다르다(CLAUDE.md · AGENTS.md · …).
# 같은 내용을 여러 이름으로 복사해 두면 **갈라진다** — 그래서 정본 하나 + 얇은 포인터로 두고,
# 이 항목이 그 꼴이 유지되는지와 "이름만 바꾸면 훅은 안 돈다"는 단서가 정본에 남아 있는지를 본다.
cmd = "bash {root}/tests/test_bootstrap_docs.sh >/dev/null 2>&1"
ok = [0]

[[smoke]]
name = "push-gate-wiring"
# ★위 push-gate 가 재는 것은 "스크립트가 살아 있는가"이지 "게이트가 걸려 있는가"가 아니다.
#   실측 사고(2026-09-26): .claude/settings.json 이 없어 훅이 아무 데도 물려 있지 않은 채로
#   push-gate 가 PASS 를 찍고 있었다 — 이 스타터 자신이 "있다고 믿는데 없다"였다.
#   그래서 **배선 여부를 재는 항목을 따로 둔다.** 설정에 적힌 명령을 꺼내 그대로 실행해 양방향으로 잰다.
cmd = "bash {root}/tests/test_hook_wiring.sh >/dev/null 2>&1"
ok = [0]

[[smoke]]
name = "push-gate"
# 게이트는 **양방향**으로 잰다: 막아야 할 것이 막히고, 통과해야 할 것이 통과하는가.
# 고장난 게이트를 '항상 통과'로 고치는 것이 가장 흔한 실패이고, 고치기 전보다 나쁘다.
cmd = "bash {root}/tests/test_block_git_push.sh >/dev/null 2>&1"
ok = [0]

# ─────────────────────────────────────────────────────────────
# [links] 노트/위키 내부 링크가 깨졌는가 (Obsidian 스타일 [[문서명]])
#   없는 프로젝트는 이 섹션을 지우면 SKIP.
# ─────────────────────────────────────────────────────────────
[links]
dirs = ["docs"]
exclude = ["raw", "archive"]
ext = ".md"
pattern = '\[\[([^\]|#]+)'

# ─────────────────────────────────────────────────────────────
# [corpus] 규약 규모 추세 — 규약은 놔두면 늘기만 한다
#   절대값이 아니라 **증분**을 본다. 줄어든 문서가 하나도 없이 크게 늘면 WARN.
# ─────────────────────────────────────────────────────────────
[corpus]
files = ["AGENTS.md", "CLAUDE.md", "README.md", "docs/conventions.md"]
dirs = ["docs/rules"]
#   ★docs/conventions.md 를 함께 본다(2026-09-26). [git] 이 2026-08-23에 정확히 같은 이유로
#     고쳐졌는데 [corpus] 는 그때 같이 안 고쳐졌다. 스타터가 실제로 주는 규약 파일이 이것인데
#     보는 대상에서 빠져 있어, 독자가 규약을 아무리 써도 「규약 규모」는 매 회차 baseline 으로만
#     나온다 — 추세를 보라고 만든 항목이 볼 것을 안 보고 있었다(백지 완주 시험에서 발견).
ext = ".md"
growth_warn_lines = 150
state_file = ".harness/corpus_state.tsv"

# ─────────────────────────────────────────────────────────────
# [git] 지난 회차 이후 개정된 규약 목록 — 2·3단계(사람/LLM 판단)의 입력
# ─────────────────────────────────────────────────────────────
#   ★기본은 꺼 둔다(2026-10-05). 이 항목은 커밋 이력을 읽으므로, 커밋하지 않는 실습에서는
#     「최근 개정 없음」 경고만 계속 낸다. 커밋 이력으로 개정 규약을 모으고 싶을 때 아래 세 줄과
#     window_days 의 주석을 푼다. 꺼 두면 점검에서 「해당 없음」으로 조용히 넘어간다.
# [git]
# repo = "."
# paths = ["AGENTS.md", "CLAUDE.md", "docs/conventions.md", "docs/rules"]
#   ★docs/conventions.md 를 함께 본다(2026-08-23). 스타터가 실제로 주는 규약 파일이
#     이것인데 초판은 docs/rules 만 봤다. 2단계 안내대로 규약을 적고 커밋해도
#     "개정이 없다" 경고가 계속 떴다 — 본 적 없는 경로만 보고 있었다.
#     docs/rules 는 그대로 둔다. 없으면 조용히 넘어가고, 규약이 늘면 그때 쓴다.
# window_days = 7

# ─────────────────────────────────────────────────────────────
# [preflight] 무거운 작업 착수 전 부하 게이트 문턱 (셸 스크립트가 이 값을 읽는다)
#   ★★판정 지표 선택의 근거 — 되돌리기 전에 읽을 것:
#     초판은 **스왑 누적 사용량 단독**으로 판정해 상시 오탐이었다.
#     (실측: 스왑 used 1,713MB로 NO-GO인데 같은 순간 커널 압력=normal·여유 71%)
#     macOS는 압력이 해소돼도 스왑을 즉시 회수하지 않으므로 **누적량은 압력의 지표가 아니다.**
#     → ①커널 압력등급 ②여유 비율 ③**스왑아웃 활동률**(실제 thrashing)로 교체하고
#       누적량은 참고 표시로 강등했다. *게이트는 "지금 압력이 있나"를 물어야 한다.*
# ─────────────────────────────────────────────────────────────
[preflight]
sample_sec = 3              # 스왑 활동률 표본 구간(초)
free_pct_min = 15           # 시스템 여유 메모리 최소 비율(%)
swapout_mbps_max = 5        # 스왑아웃 허용 속도(MB/s). 초과 = 이미 thrashing
# ★경쟁 작업은 **무게로 가른다**. 무거운 것이 돌고 있으면 다른 지표가 아무리 좋아도 차단하고,
#   가벼운 것뿐이면 경고만 하고 통과시킨다. 여기 아무것도 안 적으면 이 항목은 판정에 영향이 없다.
#   ⚠️패턴은 stale해진다 — 새 장기 스크립트를 만들면 여기에 반드시 추가하라.
process_patterns = ["train_", "solve_", "fetch_"]        # 즉시 차단(학습·대규모 적분·대량취득)
light_process_patterns = ["score_", "aggregate_", "render_"]   # 경고만(채점·집계·렌더)
swapout_companion_mbps = 0.5   # 압력 warning 을 '실제 경합'으로 볼 스왑아웃 하한(MB/s)
#   ★압력 warning 은 **단독으로는 거부하지 않는다**(경쟁 작업 또는 이 값 초과 스왑아웃과 함께일 때만).
#     8GB급 기계는 평소에도 warning 이 상시로 떠서, 단독 거부권을 주면 게이트가 항상 NO-GO가 된다.
#     critical 은 그대로 단독 거부다.
psi_warn_pct = 10           # (Linux) PSI some avg10 ≥ 이 값이면 warning — ⚠️경험적 문턱
psi_crit_pct = 50           # (Linux) 〃 ≥ 이 값이면 critical  — ⚠️경험적 문턱

# ─────────────────────────────────────────────────────────────
# [canaries] / [report]
# ─────────────────────────────────────────────────────────────
[canaries]
spec = "canaries.json"

[report]
title = "하네스 기계 점검"
# spec_doc = "[[harness-check-routine]]"    # 리포트 머리에 붙일 정본 문서 링크
